[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-bench"
version = "0.1.0"
description = "A provider-neutral, evidence-first benchmark for AI agent memory systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "onnxruntime==1.22.1",
  "pyarrow==21.0.0",
  "rank-bm25==0.2.2",
  "tokenizers==0.21.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
py-modules = []
